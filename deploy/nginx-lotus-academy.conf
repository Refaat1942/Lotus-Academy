# Dedicated vhost. Install as a NEW file; never overwrite existing sites:
#   sudo cp deploy/nginx-lotus-academy.conf /etc/nginx/sites-available/lotus-academy.conf
#   sudo ln -s /etc/nginx/sites-available/lotus-academy.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Replace academy.example.com with the real domain (do not invent one), then run certbot for HTTPS.
server {
    listen 80;
    server_name academy.example.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:15169;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;   # required for Next.js server-action origin checks
        proxy_read_timeout 60s;
    }
}
